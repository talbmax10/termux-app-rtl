name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APKs
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0-rtl.1
          TERMUX_APK_VERSION_TAG: 0.118.0-rtl.1-release
        run: |
          set -euo pipefail
          ./gradlew assembleRelease
          APK_DIR=app/build/outputs/apk/release
          ls -lh "$APK_DIR"
          test -f "$APK_DIR/termux-rtl_0.118.0-rtl.1-release_universal.apk"
          sha256sum "$APK_DIR"/*.apk > "$APK_DIR/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/release
          gh release create "$TAG" \
            "$APK_DIR"/*.apk \
            "$APK_DIR/SHA256SUMS.txt" \
            --title "Termux RTL $TAG" \
            --generate-notes
