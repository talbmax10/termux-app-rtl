name: RTL Local SSH APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0b126-termux-app-rtl]
    paths:
      - 'rtl-client/**'
      - 'terminal-view/**'
      - 'terminal-emulator/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/rtl_ssh.yml'

permissions:
  contents: read

concurrency:
  group: rtl-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          set -o pipefail
          {
            export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-tools.zip
              unzip -q /tmp/android-tools.zip -d /tmp/android-tools
              mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          } 2>&1 | tee /tmp/sdk.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -20 /tmp/sdk.log)
            exit 1
          }
      - name: Test and build SSH client (no bootstrap)
        run: |
          set -o pipefail
          ./gradlew :terminal-view:testDebugUnitTest :terminal-emulator:testDebugUnitTest :rtl-client:testDebugUnitTest :rtl-client:assembleDebug --stacktrace 2>&1 | tee /tmp/ssh-build.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E -A 12 'What went wrong|FAILED|error:|Caused by:' /tmp/ssh-build.log | head -70)
            exit 1
          }
      - name: Verify standalone package and signature
        run: |
          mkdir -p deliverables
          cp rtl-client/build/outputs/apk/debug/rtl-client-debug.apk deliverables/termux-rtl-local-ssh.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging deliverables/termux-rtl-local-ssh.apk > /tmp/badging.txt
          grep "package: name='com.termux.rtl'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify deliverables/termux-rtl-local-ssh.apk
          cp docs/RTL-SSH-AR.md deliverables/
          (cd deliverables && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: termux-rtl-local-ssh
          path: deliverables/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rtl-ssh-test-reports
          path: |
            rtl-client/build/reports/tests/
            terminal-view/build/reports/tests/
            terminal-emulator/build/reports/tests/
