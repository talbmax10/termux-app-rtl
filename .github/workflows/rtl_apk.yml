name: RTL Standalone ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0b126-termux-app-rtl]
    paths:
      - '**.java'
      - '**.gradle'
      - 'scripts/**'
      - 'app/src/main/res/**'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/rtl_apk.yml'

permissions:
  contents: read

env:
  PACKAGES_REVISION: 4f7f86a4159a3f1b90ab839f8cd9be8c301138a5

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - name: Test standalone identity and bootstrap validation
        run: python3 scripts/test_rtl_standalone.py
      - uses: actions/cache@v4
        id: bootstrap-cache
        with:
          path: rtl-bootstrap
          key: rtl-arm64-${{ env.PACKAGES_REVISION }}-${{ hashFiles('scripts/prepare-rtl-packages.py', 'scripts/package-rtl-bootstrap.py') }}
      - uses: actions/checkout@v6
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        with:
          repository: termux/termux-packages
          ref: ${{ env.PACKAGES_REVISION }}
          path: packages-source
      - name: Configure independent prefix
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        run: python3 scripts/prepare-rtl-packages.py packages-source
      - name: Compile ARM64 bootstrap from source (no upstream prebuilt debs)
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cd packages-source
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 2>&1 | tee ../bootstrap-build.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -35 ../bootstrap-build.log)
            exit 1
          }
      - name: Verify and package isolated bootstrap
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        run: python3 scripts/package-rtl-bootstrap.py packages-source/bootstrap-aarch64.zip rtl-bootstrap "$PACKAGES_REVISION"
      - uses: actions/upload-artifact@v6
        with:
          name: rtl-arm64-bootstrap
          path: rtl-bootstrap/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rtl-bootstrap-build-log
          path: bootstrap-build.log

  build:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          set -o pipefail
          {
            export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-tools.zip
              unzip -q /tmp/android-tools.zip -d /tmp/android-tools
              mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          } 2>&1 | tee /tmp/sdk.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -20 /tmp/sdk.log)
            exit 1
          }
      - uses: actions/download-artifact@v7
        with:
          name: rtl-arm64-bootstrap
          path: rtl-bootstrap
      - name: Test and build standalone ARM64 debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_RTL_BOOTSTRAP_DIR: ${{ github.workspace }}/rtl-bootstrap
          TERMUX_APP_VERSION_NAME: '0.118.0-rtl.2'
          TERMUX_APK_VERSION_TAG: 'rtl-standalone-debug'
        run: |
          set -o pipefail
          ./gradlew :terminal-view:testDebugUnitTest :terminal-emulator:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E -A 12 'What went wrong|FAILED|error:|Caused by:' /tmp/build.log | head -70)
            exit 1
          }
      - name: Verify APK package and architecture
        run: |
          APK=app/build/outputs/apk/debug/termux-app_rtl-standalone-debug_arm64-v8a.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          grep "package: name='com.termux.rtl'" /tmp/apk-badging.txt
          grep "native-code: 'arm64-v8a'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - name: Checksums
        working-directory: app/build/outputs/apk/debug
        run: sha256sum *_arm64-v8a.apk > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: termux-rtl-standalone-arm64
          path: |
            app/build/outputs/apk/debug/*_arm64-v8a.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtl-test-reports
          path: |
            terminal-view/build/reports/tests/
            terminal-emulator/build/reports/tests/
      - name: Build summary
        if: always()
        run: |
          echo '## RTL build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug APK uses the upstream public test key; do not use it as a private production signing key.' >> "$GITHUB_STEP_SUMMARY"
