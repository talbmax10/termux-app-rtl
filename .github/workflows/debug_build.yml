name: Build Independent RTL APK

on:
  push:
    branches:
      - master
      - rtl-native
      - 'github-releases/**'
  pull_request:
    branches:
      - master
      - rtl-native
  workflow_dispatch:

jobs:
  bootstrap:
    name: Build custom Termux RTL bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Clone termux-packages bootstrap builder
        uses: actions/checkout@v6
        with:
          repository: agnostic-apollo/termux-packages
          ref: infra-improvs
          path: termux-packages
          fetch-depth: 1

      - name: Configure independent package name
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^TERMUX_APP_PACKAGE=.*/TERMUX_APP_PACKAGE="com.termux.rtl"/' scripts/properties.sh
          grep -n '^TERMUX_APP_PACKAGE=' scripts/properties.sh

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Export Android NDK path
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Configured NDK: $NDK_DIR"

      - name: Build aarch64 bootstrap
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - name: Build remaining bootstraps
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures arm,x86_64,i686

      - name: Collect bootstrap archives
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../bootstrap-artifacts
          find . -maxdepth 3 -type f -name 'bootstrap-*.zip' -print -exec cp -v {} ../bootstrap-artifacts/ \;
          test "$(find ../bootstrap-artifacts -maxdepth 1 -type f -name 'bootstrap-*.zip' | wc -l)" -eq 4
          sha256sum ../bootstrap-artifacts/bootstrap-*.zip

      - name: Upload custom bootstraps
        uses: actions/upload-artifact@v6
        with:
          name: termux-rtl-bootstraps
          path: bootstrap-artifacts/bootstrap-*.zip
          if-no-files-found: error

  build:
    name: Build APKs
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download custom bootstraps
        uses: actions/download-artifact@v7
        with:
          name: termux-rtl-bootstraps
          path: app/src/main/cpp

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare independent package build
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/prepare_independent_build.sh
          grep -n 'applicationId' app/build.gradle
          grep -n 'TERMUX_PACKAGE_NAME =' termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java | head -1
          grep -n 'targetPackage' app/src/main/res/xml/shortcuts.xml

      - name: Build APKs
        shell: bash
        env:
          TERMUX_APP_VERSION_NAME: 0.118.0-rtl.1
          TERMUX_APK_VERSION_TAG: 0.118.0-rtl.1-${{ github.sha }}
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          set -euo pipefail
          ./gradlew assembleDebug

      - name: Verify independent APK package id
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/termux-rtl_0.118.0-rtl.1-${GITHUB_SHA}_apt-android-7-universal.apk
          echo "Independent Termux RTL APKs built successfully"

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: termux-rtl-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/termux-rtl_*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
