name: RTL APK

on:
  workflow_dispatch:
  push:
    branches: [rtl-only]
    paths:
      - '**.java'
      - '**.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/rtl_apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          set -o pipefail
          {
            export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-tools.zip
              unzip -q /tmp/android-tools.zip -d /tmp/android-tools
              mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          } 2>&1 | tee /tmp/sdk.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -20 /tmp/sdk.log)
            exit 1
          }
      - name: Test and build ARM64 debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
          TERMUX_APP_VERSION_NAME: '0.118.0-rtl.1'
          TERMUX_APK_VERSION_TAG: 'rtl-arm64'
        run: |
          set -o pipefail
          ./gradlew :terminal-view:testDebugUnitTest :terminal-emulator:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log || {
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E -A 12 'What went wrong|FAILED|error:|Caused by:' /tmp/build.log | head -70)
            exit 1
          }
      - name: Verify exactly one ARM64 APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          echo "APK: $apk"
          echo "Size: $(stat -c%s "$apk") bytes"
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$apk" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-ARM64 native library found"
            exit 1
          fi
          echo "Verified: exactly one APK, ARM64-only native libraries."
      - name: Checksums
        working-directory: app/build/outputs/apk/debug
        run: sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: termux-rtl-debug-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtl-test-reports
          path: |
            terminal-view/build/reports/tests/
            terminal-emulator/build/reports/tests/
      - name: Build summary
        if: always()
        run: |
          echo '## RTL ARM64 build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Single APK: arm64-v8a only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Package: com.termux' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bootstrap: upstream apt-android-7' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug APK uses the upstream public test key; do not use it as a private production signing key.' >> "$GITHUB_STEP_SUMMARY"
