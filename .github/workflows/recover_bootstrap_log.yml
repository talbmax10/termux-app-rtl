name: Recover bootstrap log

on:
  push:
    branches:
      - arena/01a08c67-termux-app-rtl
    paths:
      - .github/workflows/recover_bootstrap_log.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to recover (default 34514923798)'
        required: false
        default: '34514923798'

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Determine run ID
        id: rid
        shell: bash
        run: |
          RID="${{ github.event.inputs.run_id }}"
          if [ -z "$RID" ] || [ "$RID" = "" ]; then RID="34514923798"; fi
          # If triggered by push, use hardcoded latest failed run
          if [ "${{ github.event_name }}" = "push" ]; then RID="34514923798"; fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Recovering run $RID"

      - name: Download bootstrap log artifact
        uses: actions/download-artifact@v6
        with:
          name: bootstrap-build-log-${{ steps.rid.outputs.run_id }}
          path: /tmp/recovered
          run-id: ${{ steps.rid.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Show and post log tail
        shell: bash
        run: |
          set +e; set +o pipefail
          ls -lh /tmp/recovered/ || true
          find /tmp/recovered -type f | head -n 20 || true
          LOG="/tmp/recovered/bootstrap_build.log"
          if [ ! -f "$LOG" ]; then LOG=$(find /tmp/recovered -name "*.log" | head -1); fi
          if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then echo "No log found in /tmp/recovered"; ls -R /tmp/recovered || true; exit 0; fi
          echo "=== Log size ==="
          wc -c "$LOG" || true; wc -l "$LOG" || true
          echo "=== Last 500 lines (last 60000 bytes) ==="
          tail -n 500 "$LOG" > /tmp/tail_full.txt || true
          # Keep last 60000 bytes to fit GitHub comment limit
          if [ $(wc -c < /tmp/tail_full.txt) -gt 60000 ]; then tail -c 60000 /tmp/tail_full.txt > /tmp/tail.txt; else cp /tmp/tail_full.txt /tmp/tail.txt; fi
          cat /tmp/tail.txt || true
          echo "=== Posting to PR via step summary ==="
          {
            echo "### Recovered log for run ${{ steps.rid.outputs.run_id }} (last 500 lines)"
            echo '```'
            cat /tmp/tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          echo "=== Step summary written ==="

      - name: Post recovered log to PR via github-script
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/tail.txt';
            let body = '';
            try { body = fs.readFileSync(path, 'utf8'); } catch(e) { body = 'Failed to read log: ' + e; }
            // Truncate to 60000 for GitHub comment limit
            if (body.length > 60000) body = body.slice(-60000);
            body = "Recovered log for run ${{ steps.rid.outputs.run_id }} (last 500 lines, from artifact bootstrap-build-log-${{ steps.rid.outputs.run_id }}):\n\n```\n" + body + "\n```";
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body: body
              });
              core.info('Posted comment via github-script');
            } catch(e) {
              core.warning('Failed to post comment: ' + e);
            }

